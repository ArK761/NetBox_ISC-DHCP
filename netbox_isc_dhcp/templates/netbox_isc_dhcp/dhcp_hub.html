{% extends 'generic/_base.html' %}{% load isc_dhcp_i18n %}
{% block title %}{% tr "menu.dhcp" %}{% endblock %}
{% block content %}
<div class="row"><div class="col-12 col-xl-8">
  <div class="list-group">
    {% for url, icon, title, text in items %}
    <a href="{% url url %}" class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3">
      <i class="mdi {{ icon }} fs-2 text-primary"></i>
      <span><strong class="d-block">{% tr title %}</strong><span class="text-muted small">{% tr text %}</span></span>
      <i class="mdi mdi-chevron-right ms-auto fs-4 text-muted"></i>
    </a>
    {% endfor %}
  </div>
</div></div>
{% endblock %}
