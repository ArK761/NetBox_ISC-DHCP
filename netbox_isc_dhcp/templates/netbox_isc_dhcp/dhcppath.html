{% extends 'generic/object.html' %}{% load isc_dhcp_i18n %}
{% block content %}
<div class="row mb-3"><div class="col col-md-6"><div class="card">
  <h5 class="card-header">{% tr "lbl.directory" %}</h5>
  <table class="table table-hover attr-table">
    <tr><th scope="row">{% tr "lbl.name" %}</th><td>{{ object.name }}</td></tr>
    <tr><th scope="row">{% tr "lbl.path" %}</th><td><code>{{ object.path }}</code></td></tr>
    <tr><th scope="row">{% tr "lbl.order" %}</th><td>{{ object.order }}</td></tr>
  </table></div></div></div>
{% endblock %}
