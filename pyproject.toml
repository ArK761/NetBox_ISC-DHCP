[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-isc-dhcp"
dynamic = ["version"]
description = "NetBox plugin: generate ISC DHCP configuration from NetBox data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[tool.setuptools.dynamic]
version = { attr = "netbox_isc_dhcp.__version__" }

[tool.setuptools.packages.find]
include = ["netbox_isc_dhcp*"]

[tool.setuptools.package-data]
netbox_isc_dhcp = ["defaults/*.conf", "defaults/*.j2", "templates/**/*.html"]
